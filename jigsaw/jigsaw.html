<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8" />
   <meta name="viewport" content="width=device-width,initial-scale=1.0">
   <title>Jigsaw Album</title>
   <link rel="stylesheet" href="jigsaw.css" />
   <script src="jigsaw.js" defer></script>
</head>
<body>
   <header>
      <h1>My Jigsaw Photo Album</h1>
   </header>
	
	<main>
   <section>
	  <div id="container" class="metadata-grid"></div>

      <div id="lightbox" ></div> 
	  <button onclick="resetPuzzleBoard()">Reset & Shuffle Board</button>
   <br><br>
      
      <!-- SVG workspace -->
      <svg id="puzzleBoard" width="800" height="600" viewBox="0 0 800 600" style="background: #ffff00; overflow: visible; margin: 0 auto; display: block;">
         <defs id="puzzleDefs">
            <!-- Dynamic SVG clipPaths will be injected here by JavaScript -->
         </defs>
         <!-- Puzzle piece groups (<g>) will be rendered here -->
      </svg>
	    <p><em> TIP: Start with each corner piece, build out the frame next, and then fill in the middle.</em>
      </p> 
	  
	  
	  <br>
	  <footer> 
		<p style="font-size: 16px;">&copy; GitHub Pages | 
		<a href="../index.html">5han's Portfoio Home</a> | Sept 2026</p> 
	</footer> 
   </section>
   
   </main>
   
  
</body>

</html>
